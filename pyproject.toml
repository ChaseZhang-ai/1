[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swift-iars"
version = "1.0.0"
description = "Algorithm core of the Swift IARS integrated augmented-reality system: redundant sensor fusion, head-motion stabilisation, binocular display alignment and multi-sensor SLAM/INS fusion."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zixin Jia", email = "zixinzenith@gmail.com" }]
keywords = ["augmented-reality", "sensor-fusion", "eskf", "slam", "head-mounted-display", "air-data"]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.6", "pillow>=9.0"]

[project.urls]
Homepage = "https://github.com/zixinzenith/1"

[tool.setuptools.packages.find]
include = ["iars*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
