name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Python 3.9 prebuilds are not available on the newest Ubuntu runners, so the
    # 3.9 leg is pinned to ubuntu-22.04 and the modern leg runs on ubuntu-latest.
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
